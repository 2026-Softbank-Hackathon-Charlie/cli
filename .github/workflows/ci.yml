name: ci

# Target: a PR is checked in under a minute. PRs reuse the Go module and build
# cache that main saves, recompile only what changed, and rerun only the tests
# whose inputs changed (go test's own result cache).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/2026-Softbank-Hackathon-Charlie
    steps:
      - uses: actions/checkout@v5

      # platform and migration-engine are private modules. MODULE_READ_TOKEN is
      # a repository secret: a fine-grained token with Contents read on both.
      - name: Private modules
        env:
          TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret MODULE_READ_TOKEN is not set (read access to platform and migration-engine)."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/2026-Softbank-Hackathon-Charlie/".insteadOf "https://github.com/2026-Softbank-Hackathon-Charlie/"

      - name: go.mod has no local replace
        run: |
          if grep -n '^replace .* => \.' go.mod; then
            echo "::error::go.mod points at a local checkout; require a pushed platform commit instead."
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # restored below from main's cache instead

      - name: Restore Go cache from main
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Vet
        run: go vet ./...

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      # No -count=1: unchanged packages reuse their cached result.
      - name: Test (race)
        run: go test -race ./...

      # Only main saves, so a PR spends no time uploading.
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
